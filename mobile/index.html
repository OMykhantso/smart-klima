<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Smart Klima</title>
<meta name="theme-color" content="#0b7a8a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="top-in">
      <button class="iconbtn" id="backBtn" type="button" aria-label="Назад" hidden>←</button>
      <h1 id="topTitle">Smart Klima</h1>
      <span class="role" id="roleBadge">Клієнт</span>
    </div>
  </header>

  <main id="screen" class="screen"></main>

  <nav class="tabs" id="tabs"></nav>
</div>

<div class="sheet-bg" id="sheetBg" hidden>
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="grip"></div>
    <div id="sheetBody"></div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="../shared/seed.js"></script>
<script src="../shared/config.js"></script>
<script src="../shared/api.js"></script>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
